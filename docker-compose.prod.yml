# ADHD Print Task Management System - Production Docker Compose
# Optimized for production deployment

version: '3.8'

services:
  # Main application service with ASGI
  adhd-print:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: adhd-print-prod
    ports:
      - "80:8000"
    volumes:
      # Persistent data storage
      - adhd_data:/app/data
      # Static files served by nginx
      - adhd_static:/app/staticfiles
      # Application logs
      - adhd_logs:/app/logs
    environment:
      - DJANGO_DEBUG=False
      - DJANGO_SETTINGS_MODULE=adhd_print_project.settings
      - ASGI_WORKERS=4
      - ASGI_HOST=0.0.0.0
      - ASGI_PORT=8000
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/tasks/"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 30s

  # PostgreSQL database for production
  postgres:
    image: postgres:15-alpine
    container_name: adhd-print-db
    environment:
      POSTGRES_DB: adhd_print
      POSTGRES_USER: adhd_print
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_this_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adhd_print"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Redis for caching and session storage
  redis:
    image: redis:7-alpine
    container_name: adhd-print-redis
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Nginx reverse proxy and static file server
  nginx:
    image: nginx:alpine
    container_name: adhd-print-nginx
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - adhd_static:/var/www/static:ro
      - adhd_logs:/var/log/adhd_print
    depends_on:
      - adhd-print
    restart: unless-stopped

volumes:
  # Persistent data storage
  adhd_data:
    driver: local
  
  # Static files
  adhd_static:
    driver: local
  
  # Application logs
  adhd_logs:
    driver: local
  
  # Database data
  postgres_data:
    driver: local
  
  # Redis data
  redis_data:
    driver: local

networks:
  default:
    name: adhd-print-prod-network