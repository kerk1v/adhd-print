  #   restart: unless-stopped

volumes:
  # Persistent data storage
  adhd_data:
    driver: local
  
  # Static files
  adhd_static:
    driver: local
  
  # Application logs
  adhd_logs:
    driver: local
  
  # Database data (if using PostgreSQL)
  # postgres_data:
  #   driver: local
  
  # Redis data (if using Redis)
  # redis_data:
  #   driver: local

networks:
  default:
    name: adhd-print-network