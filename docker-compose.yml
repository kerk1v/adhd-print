# ADHD Print Task Management System - Docker Compose
# Development and production configurations

version: '3.8'

services:
  # Main application service
  adhd-print-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adhd-print-app
    ports:
      - "8000:8000"
    volumes:
      # Mount source code for development
      - .:/app
      # Persistent data storage
      - adhd_data:/app/data
      # Static files
      - adhd_static:/app/staticfiles
      # Logs
      - adhd_logs:/app/logs
    environment:
      - DJANGO_DEBUG=True
      - DJANGO_SETTINGS_MODULE=adhd_print_project.settings
      - PYTHONPATH=/app
    command: python manage.py runserver 0.0.0.0:8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/tasks/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Production service (commented out for development)
