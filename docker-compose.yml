  #     - adhd_data:/app/data
  #     - adhd_static:/app/staticfiles
  #     - adhd_logs:/app/logs
  #   environment:
  #     - DJANGO_DEBUG=False
  #     - DJANGO_SETTINGS_MODULE=adhd_print_project.settings
