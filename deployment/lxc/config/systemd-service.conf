[Unit]
Description=ADHD Print Task Management System
After=network.target
Wants=network.target

[Service]
Type=forking
User=root
WorkingDirectory=/opt/adhd-print
ExecStart=/opt/adhd-print/scripts/start-services.sh
ExecStop=/opt/adhd-print/scripts/stop-services.sh
ExecReload=/opt/adhd-print/scripts/reload-services.sh
Restart=always
RestartSec=10

[Install]
WantedBy=multi-user.target