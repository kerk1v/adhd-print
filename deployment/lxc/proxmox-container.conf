# Proxmox LXC Configuration for ADHD Print Task Management System

# Container specifications
arch: amd64
cores: 2
memory: 2048
net0: name=eth0,bridge=vmbr0,ip=dhcp
ostype: ubuntu
rootfs: local-lvm:8
swap: 512
unprivileged: 1
onboot: 1

# Features
features: nesting=1

# Startup order (optional)
startup: order=3,up=30,down=30

# Resource limits
cpuunits: 1024

# Console settings
console: 1

# Description
description: ADHD Print Task Management System - Django web application with ESC/POS printer support for task organization and printing.