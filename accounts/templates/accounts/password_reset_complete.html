{% extends 'tasks/base.html' %}

{% block title %}Password Reset Complete - ADHD Print Task Manager{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 text-center">
        <div class="card">
            <div class="card-body">
                <div class="mb-4">
                    <i class="fas fa-check-circle fa-4x text-success"></i>
                </div>
                <h2 class="card-title text-success">Password Reset Complete!</h2>
                <p class="lead">
                    Your password has been successfully updated.
                </p>
                
                <div class="alert alert-success">
                    <p><strong>You can now log in with your new password.</strong></p>
                </div>
                
                <div class="mt-4">
                    <a href="{% url 'accounts:login' %}" class="btn btn-primary btn-lg">
                        <i class="fas fa-sign-in-alt"></i> Login Now
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
