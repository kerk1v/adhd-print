<!DOCTYPE html>
<html>
<head>
    <title>Print Modal Debug Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h1>Print Modal Debug Test</h1>
        
        <div class="row">
            <div class="col-md-6">
                <h3>Test Controls</h3>
                <button type="button" class="btn btn-primary" onclick="testPrintModal()">
                    Test Print Modal Function
                </button>
                <br><br>
                <button type="button" class="btn btn-success" onclick="testShowMessage()">
                    Test Show Message Function
                </button>
                <br><br>
                <button type="button" class="btn btn-warning" onclick="testDirectPrintRequest()">
                    Test Direct Print Request
                </button>
                <br><br>
                <button type="button" class="btn btn-info" onclick="showPrintConfirmModal(799)">
                    Show Print Modal for Task 799
                </button>
            </div>
            <div class="col-md-6">
                <h3>Debug Output</h3>
                <div id="debug-output" class="border p-3" style="min-height: 200px; background: #f8f9fa;">
                    <em>Debug information will appear here...</em>
                </div>
            </div>
        </div>
    </div>

    <!-- Print Confirmation Modal -->
    <div class="modal fade" id="printConfirmModal" tabindex="-1" aria-labelledby="printConfirmModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="printConfirmModalLabel">
                        <i class="fas fa-print"></i> Print Task
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-center">
                    <div class="mb-3">
                        <i class="fas fa-print fa-3x text-primary mb-3"></i>
                    </div>
                    <h6>Print this task?</h6>
                    <p class="text-muted mb-0">The task will be printed to your configured ESC/P printer.</p>
                </div>
                <div class="modal-footer justify-content-center">
                    <button type="button" class="btn btn-secondary me-2" data-bs-dismiss="modal">
                        <i class="fas fa-times"></i> No
                    </button>
                    <button type="button" class="btn btn-primary" id="confirmPrintBtn">
                        <i class="fas fa-print"></i> Yes, Print
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- CSRF token for testing -->
    <input type="hidden" name="csrfmiddlewaretoken" value="test-csrf-token">

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
    function debugLog(message) {
        const output = document.getElementById('debug-output');
        const timestamp = new Date().toLocaleTimeString();
        output.innerHTML += `<div><strong>[${timestamp}]</strong> ${message}</div>`;
        output.scrollTop = output.scrollHeight;
        console.log(message);
    }

    function testPrintModal() {
        debugLog('Testing print modal function...');
        try {
            if (typeof showPrintConfirmModal === 'function') {
                debugLog('✅ showPrintConfirmModal function exists');
                showPrintConfirmModal(799);
                debugLog('✅ Print modal called successfully');
            } else {
                debugLog('❌ showPrintConfirmModal function not found');
            }
        } catch (error) {
            debugLog(`❌ Error calling print modal: ${error.message}`);
        }
    }

    function testShowMessage() {
        debugLog('Testing showMessage function...');
        try {
            if (typeof showMessage === 'function') {
                debugLog('✅ showMessage function exists');
                showMessage('Test message', 'success');
                debugLog('✅ showMessage called successfully');
            } else {
                debugLog('❌ showMessage function not found');
            }
        } catch (error) {
            debugLog(`❌ Error calling showMessage: ${error.message}`);
        }
    }

    function testDirectPrintRequest() {
        debugLog('Testing direct print request...');
        
        fetch('/tasks/print/799/', {
            method: 'POST',
            headers: {
                'X-CSRFToken': 'test-csrf-token',
                'Content-Type': 'application/json',
            }
        })
        .then(response => {
            debugLog(`Response status: ${response.status}`);
            return response.json();
        })
        .then(data => {
            debugLog(`Response data: ${JSON.stringify(data)}`);
        })
        .catch(error => {
            debugLog(`❌ Direct request error: ${error.message}`);
        });
    }

    // Simple showMessage implementation for testing
    function showMessage(message, type) {
        debugLog(`showMessage called: "${message}" (${type})`);
        const alertHtml = `
            <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        `;
        $('.container').prepend(alertHtml);
    }

    // Simple print modal function
    let taskIdToPrint = null;

    function showPrintConfirmModal(taskId) {
        debugLog(`showPrintConfirmModal called with task ID: ${taskId}`);
        taskIdToPrint = taskId;
        $('#printConfirmModal').modal('show');
    }

    // Print confirmation handler
    $(document).ready(function() {
        debugLog('Document ready - setting up print confirmation handler');
        
        $('#confirmPrintBtn').on('click', function() {
            debugLog('Print confirmation button clicked');
            
            if (taskIdToPrint) {
                debugLog(`Sending print request for task ${taskIdToPrint}`);
                
                // Show loading state
                $(this).html('<i class="fas fa-spinner fa-spin"></i> Printing...').prop('disabled', true);
                
                // Send print request
                fetch(`/tasks/print/${taskIdToPrint}/`, {
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value,
                        'Content-Type': 'application/json',
                    }
                })
                .then(response => {
                    debugLog(`Print request response status: ${response.status}`);
                    return response.json();
                })
                .then(data => {
                    debugLog(`Print response data: ${JSON.stringify(data)}`);
                    
                    if (data.success) {
                        showMessage(data.message || 'Task printed successfully!', 'success');
                    } else {
                        showMessage(data.message || 'Failed to print task.', 'danger');
                    }
                    $('#printConfirmModal').modal('hide');
                })
                .catch(error => {
                    debugLog(`❌ Print request error: ${error.message}`);
                    showMessage('An error occurred while printing the task.', 'danger');
                    $('#printConfirmModal').modal('hide');
                })
                .finally(() => {
                    // Reset button state
                    $('#confirmPrintBtn')
                        .html('<i class="fas fa-print"></i> Yes, Print')
                        .prop('disabled', false);
                    
                    taskIdToPrint = null;
                    debugLog('Print operation completed');
                });
            } else {
                debugLog('❌ No task ID set for printing');
            }
        });
    });
    </script>
</body>
</html>
